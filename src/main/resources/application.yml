spring:
  application:
    name: rbac-engine
  datasource:
    url: jdbc:h2:file:./data/rbacdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080